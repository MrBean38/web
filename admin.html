<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform U | Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --green: #10b981; --dark: #0a0f1e; --dark2: #111827; --muted: #94a3b8; --border: rgba(255,255,255,0.08); --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: white; min-height: 100vh; }

        /* LOGIN SCREEN */
        #loginScreen {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(79,70,229,0.15) 0%, transparent 60%), var(--dark);
        }
        .login-box { background: var(--dark2); border: 1px solid var(--border); border-radius: 28px; padding: 48px; width: 90%; max-width: 400px; text-align: center; }
        .login-box .lock { font-size: 52px; margin-bottom: 16px; }
        .login-box h2 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; color: white; font-family: inherit; font-size: 15px; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .login-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 14px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #3730a3; }
        .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

        /* ADMIN PANEL */
        #adminPanel { display: none; }
        .admin-nav { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .admin-nav .logo { font-family: 'Syne', sans-serif; font-weight: 900; font-size: 20px; }
        .admin-nav .logo span { color: var(--green); }
        .admin-badge { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 4px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; }
        .logout-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 8px 18px; border-radius: 50px; font-size: 13px; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .logout-btn:hover { background: rgba(239,68,68,0.2); }

        .admin-content { padding: 40px 5%; }

        /* STATS */
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .a-stat { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; padding: 28px; }
        .a-stat-num { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 900; color: var(--green); }
        .a-stat-label { color: var(--muted); font-size: 13px; margin-top: 6px; }

        /* TABLE SECTION */
        .table-section { background: var(--dark2); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; }
        .table-header { padding: 24px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: gap; gap: 16px; }
        .table-header h2 { font-family: 'Syne', sans-serif; font-size: 20px; }
        .table-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-input { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; color: white; padding: 8px 14px; font-family: inherit; font-size: 14px; width: 200px; }
        .search-input:focus { outline: none; border-color: var(--green); }
        .filter-select { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; color: white; padding: 8px 12px; font-family: inherit; font-size: 14px; }
        .filter-select option { background: var(--dark2); }
        .export-btn { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--green); padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; transition: 0.3s; }
        .export-btn:hover { background: rgba(16,185,129,0.2); }
        .clear-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; transition: 0.3s; }
        .clear-btn:hover { background: rgba(239,68,68,0.2); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); padding: 14px 20px; text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; white-space: nowrap; }
        td { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 14px; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .course-pill { display: inline-block; background: rgba(79,70,229,0.1); border: 1px solid rgba(79,70,229,0.25); color: #a5b4fc; padding: 3px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .delete-btn { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; padding: 5px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .delete-btn:hover { background: rgba(239,68,68,0.2); }
        .empty-row td { text-align: center; color: var(--muted); padding: 60px; }

        /* CHANGE PASSWORD */
        .settings-section { margin-top: 30px; background: var(--dark2); border: 1px solid var(--border); border-radius: 24px; padding: 28px; }
        .settings-section h3 { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 20px; }
        .settings-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
        .settings-row .form-group { flex: 1; min-width: 180px; }
        .change-btn { background: var(--primary); color: white; border: none; padding: 13px 24px; border-radius: 12px; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .change-btn:hover { background: #3730a3; }

        @media (max-width: 600px) {
            .admin-content { padding: 24px 4%; }
            .table-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-box">
        <div class="lock">🔐</div>
        <h2>Admin Login</h2>
        <p>Enter your credentials to access the dashboard.</p>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="adminUser" placeholder="admin" value="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
        </div>
        <button class="login-btn" onclick="doLogin()">Login to Dashboard →</button>
        <p class="error-msg" id="loginErr">❌ Incorrect username or password.</p>
        <p style="color: var(--muted); font-size: 12px; margin-top: 20px;">Default: admin / admin123</p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <nav class="admin-nav">
        <div style="display: flex; align-items: center; gap: 14px;">
            <div class="logo">TRANSFORM <span>U</span> 🚀</div>
            <span class="admin-badge">ADMIN</span>
        </div>
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </nav>

    <div class="admin-content">
        <h1 style="font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 8px;">Admin Dashboard</h1>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 30px;">Manage all student enrollments from here.</p>

        <!-- Stats -->
        <div class="admin-stats" id="adminStats"></div>

        <!-- Table -->
        <div class="table-section">
            <div class="table-header">
                <h2>All Enrollments</h2>
                <div class="table-actions">
                    <input class="search-input" id="searchInput" type="text" placeholder="Search name, phone..." oninput="renderTable()">
                    <select class="filter-select" id="filterCourse" onchange="renderTable()">
                        <option value="">All Courses</option>
                        <option>Web Development</option>
                        <option>Graphics Design</option>
                        <option>Digital Marketing</option>
                        <option>Software Engineering</option>
                    </select>
                    <button class="export-btn" onclick="exportCSV()">Export CSV</button>
                    <button class="clear-btn" onclick="clearAll()">Clear All</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Settings -->
        <div class="settings-section">
            <h3>⚙️ Change Admin Password</h3>
            <div class="settings-row">
                <div class="form-group">
                    <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:8px;">New Password</label>
                    <input type="password" id="newPass" placeholder="New password" class="search-input" style="width:100%;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-size:13px; color:var(--muted); margin-bottom:8px;">Confirm Password</label>
                    <input type="password" id="confirmPass" placeholder="Confirm password" class="search-input" style="width:100%;">
                </div>
                <button class="change-btn" onclick="changePassword()">Update Password</button>
            </div>
        </div>
    </div>
</div>

<script>
let ADMIN_PASSWORD = localStorage.getItem('tu_admin_pass') || 'admin123';

function doLogin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    ADMIN_PASSWORD = localStorage.getItem('tu_admin_pass') || 'admin123';

    if (user === 'admin' && pass === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        renderStats();
        renderTable();
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

function adminLogout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('adminPass').value = '';
    document.getElementById('loginErr').style.display = 'none';
}

function getEnrollments() {
    return JSON.parse(localStorage.getItem('tu_enrollments') || '[]');
}

function renderStats() {
    const all = getEnrollments();
    const courses = ['Web Development','Graphics Design','Digital Marketing','Software Engineering'];
    const statsEl = document.getElementById('adminStats');
    const counts = courses.map(c => all.filter(e => e.course === c).length);
    statsEl.innerHTML = `
        <div class="a-stat"><div class="a-stat-num">${all.length}</div><div class="a-stat-label">Total Enrollments</div></div>
        ${courses.map((c, i) => `<div class="a-stat"><div class="a-stat-num">${counts[i]}</div><div class="a-stat-label">${c}</div></div>`).join('')}
    `;
}

function renderTable() {
    const all = getEnrollments();
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filter = document.getElementById('filterCourse').value;
    const tbody = document.getElementById('tableBody');

    let filtered = all.filter(e => {
        const matchSearch = !search || e.name.toLowerCase().includes(search) || e.phone.includes(search) || e.email.toLowerCase().includes(search);
        const matchFilter = !filter || e.course === filter;
        return matchSearch && matchFilter;
    });

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No enrollments found.</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map((e, i) => `
        <tr>
            <td style="color: var(--muted);">${i + 1}</td>
            <td><b>${e.name}</b></td>
            <td style="color: var(--muted);">${e.email || '—'}</td>
            <td>${e.phone}</td>
            <td><span class="course-pill">${e.course}</span></td>
            <td style="color: var(--muted);">${e.date || '—'}</td>
            <td><button class="delete-btn" onclick="deleteEnrollment('${e.phone}', '${e.course}')">Delete</button></td>
        </tr>
    `).join('');
}

function deleteEnrollment(phone, course) {
    if (!confirm(`Delete ${phone}'s enrollment in "${course}"?`)) return;
    let all = getEnrollments();
    all = all.filter(e => !(e.phone === phone && e.course === course));
    localStorage.setItem('tu_enrollments', JSON.stringify(all));
    renderStats();
    renderTable();
}

function clearAll() {
    if (!confirm('Are you sure you want to delete ALL enrollments? This cannot be undone!')) return;
    localStorage.setItem('tu_enrollments', '[]');
    renderStats();
    renderTable();
}

function exportCSV() {
    const all = getEnrollments();
    if (all.length === 0) { alert('No data to export!'); return; }
    const rows = [['Name','Email','Phone','Course','Date'], ...all.map(e => [e.name, e.email, e.phone, e.course, e.date])];
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transform-u-enrollments.csv';
    a.click();
}

function changePassword() {
    const np = document.getElementById('newPass').value;
    const cp = document.getElementById('confirmPass').value;
    if (!np || np.length < 6) { alert('Password must be at least 6 characters!'); return; }
    if (np !== cp) { alert('Passwords do not match!'); return; }
    localStorage.setItem('tu_admin_pass', np);
    alert('✅ Password updated successfully!');
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
}
</script>
</body>
</html>
